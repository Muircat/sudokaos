<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chaos Sudoku</title>
<style>
:root{--B:min(90vw,420px);--bg:#fff;--ink:#111;--muted:#999;--line:#e6e6e6;--accent:#3b5bdb;--sel:#eef1fb;--bad:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#eee;--muted:#666;--line:#2a2a2a;--accent:#8ca2ff;--sel:#1e2333;--bad:#ff6a5f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;user-select:none;overflow-x:hidden}
#wrap{display:flex;flex-direction:column;align-items:center;padding:40px 0}
h1{font-size:17px;font-weight:600;margin:0 0 24px}
#barw{width:var(--B);height:2px;background:var(--line);margin-bottom:12px}
#bar{height:100%;width:100%;background:var(--ink)}
#stage{perspective:1000px}
#board{position:relative;width:var(--B);height:var(--B);border:1.5px solid var(--ink);transition:transform 1s cubic-bezier(.5,-.4,.5,1.4)}
#boxes{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);pointer-events:none;z-index:3}
#boxes div{border:.75px solid var(--ink)}
.cell{position:absolute;left:0;top:0;width:11.1111%;height:11.1111%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--B)*.052);color:var(--accent);border:.5px solid var(--line);cursor:pointer;
  transition:transform .7s cubic-bezier(.68,-.5,.27,1.5) var(--d,0ms)}
.instant .cell{transition:none}
.cell.long span{font-size:.6em}
.given{color:var(--ink);font-weight:600}
.sel,.same{background:var(--sel)}
.bad{color:var(--bad)}
.shy .given span{opacity:.05;transition:opacity 1s}
#msg{height:20px;margin:14px 0 6px;font-size:12px;letter-spacing:.05em;color:var(--muted);text-align:center;transition:opacity .3s}
#pad{width:var(--B);display:grid;grid-template-columns:repeat(5,1fr)}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer}
#pad button{height:52px;font-size:20px}
#pad button:active{background:var(--sel)}
#diff{display:flex;gap:18px;margin:-12px 0 20px}
#diff button{font-size:13px;color:var(--muted)}
#diff button.on{color:var(--ink);font-weight:600}
.ctl{display:flex;gap:24px;margin-top:16px}
.ctl button{font-size:13px;color:var(--muted)}
#evil{position:fixed;top:14px;left:16px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;color:var(--muted);z-index:5}
.evil #evil,.evil h1{color:var(--bad)}
.evil #bar{background:var(--bad)}
.evil #board{border-color:var(--bad)}
#board{transition:transform 1s cubic-bezier(.5,-.4,.5,1.4),filter .8s}
#board.fog{filter:blur(3px)}
#board.ink .cell:not(.given) span{opacity:.05;transition:opacity 1s}
#stage.quake{animation:quake .18s infinite}
@keyframes quake{25%{transform:translate(-3px,2px)}50%{transform:translate(2px,-3px)}75%{transform:translate(3px,3px)}}
</style></head>
<body>
<button id="evil">evil</button>
<div id="wrap">
  <h1>Chaos Sudoku</h1>
  <div id="diff"><button data-n="40">Easy</button><button data-n="50" class="on">Medium</button><button data-n="64">Hard</button></div>
  <div id="barw"><div id="bar"></div></div>
  <div id="stage"><div id="board"><div id="boxes"></div></div></div>
  <div id="msg"></div>
  <div id="pad"></div>
  <div class="ctl"><button id="new">New game</button><button id="summon">Summon chaos</button></div>
</div>
<script>
const GLYPHS=[
 ['1','2','3','4','5','6','7','8','9'],
 ['A','B','C','D','E','F','G','H','I'],
 ['一','二','三','四','五','六','七','八','九'],
 ['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ'],
 ['○','●','△','▲','□','■','◇','◆','✕'],
 ['α','β','γ','δ','ε','ζ','η','θ','λ'],
 ['I','II','III','IV','V','VI','VII','VIII','IX']
];
const INSULTS=['You angered the grid.','Wrong. The grid remembers.','That was a choice.','Bold. Incorrect. Punished.'];
const $=id=>document.getElementById(id), board=$('board'), bar=$('bar'), pad=$('pad'), msg=$('msg');
const R=n=>Math.floor(Math.random()*n), pick2=()=>{const a=R(3);return[a,(a+1+R(2))%3]}, B3=n=>Math.floor(n/3);
let g=0,cells=[],sel=null,events=0,start=0,nextAt=0,interval=15000,over=false,lastPunish=0,tiltT,shyT,msgT;
const G=v=>GLYPHS[g][v-1];

for(let i=0;i<9;i++)$('boxes').appendChild(document.createElement('div'));
for(let v=1;v<=10;v++){const b=document.createElement('button');b.onclick=()=>input(v===10?0:v);pad.appendChild(b)}

function move(f){cells.forEach(k=>{[k.r,k.c]=f(k.r,k.c);k.el.style.setProperty('--d',R(300)+'ms')})}

// Moves that keep the sudoku valid
const STRUCT=[
 ()=>{const b=R(3),[i,j]=pick2(),a=b*3+i,d=b*3+j;move((r,c)=>[r===a?d:r===d?a:r,c]);return `Rows ${a+1} and ${d+1} eloped.`},
 ()=>{const b=R(3),[i,j]=pick2(),a=b*3+i,d=b*3+j;move((r,c)=>[r,c===a?d:c===d?a:c]);return `Columns ${a+1} and ${d+1} swapped.`},
 ()=>{const[p,q]=pick2();move((r,c)=>{const b=B3(r);return[b===p?q*3+r%3:b===q?p*3+r%3:r,c]});return 'Tectonic shift.'},
 ()=>{const[p,q]=pick2();move((r,c)=>{const b=B3(c);return[r,b===p?q*3+c%3:b===q?p*3+c%3:c]});return 'The pillars traded places.'},
 ()=>{move((r,c)=>[c,r]);return 'Reality transposed.'},
 ()=>{move((r,c)=>[c,8-r]);return 'The board got dizzy.'},
 ()=>{move((r,c)=>[r,8-c]);return 'Mirror dimension.'},
 ()=>{const x=1+R(9);let y=1+R(8);if(y>=x)y++;const gx=G(x),gy=G(y);
   cells.forEach(k=>{if(k.v===x)k.v=y;else if(k.v===y)k.v=x});return `Every ${gx} is now a ${gy}, and vice versa.`}
];
// Display-only mischief
const FX=[
 ()=>{let n;do n=R(GLYPHS.length);while(n===g);g=n;return 'The language changed.'},
 ()=>{const v=[['rotateZ(180deg)','Australia mode.'],[`rotateX(${25+R(20)}deg) rotateZ(${R(20)-10}deg)`,'Gravity is a suggestion.'],[`skew(${R(20)-10}deg,${R(10)-5}deg) scale(.92)`,'The board had one drink too many.']][R(3)];
   board.style.transform=v[0];clearTimeout(tiltT);tiltT=setTimeout(()=>board.style.transform='',9000);return v[1]},
 ()=>{board.classList.add('shy');clearTimeout(shyT);shyT=setTimeout(()=>board.classList.remove('shy'),7000);return 'The clues are shy.'}
];

// Evil-only extras (still always solvable)
function timed(el,cls,ms){el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function resetPad(){[...pad.children].forEach((b,i)=>b.style.order=i)}
const EVIL=[
 ()=>{const n=2+R(3);for(let i=0;i<n;i++)STRUCT[R(STRUCT.length)]();return `${n} things happened at once.`},
 ()=>{timed(board,'fog',5000);return 'Fog rolled in.'},
 ()=>{timed($('stage'),'quake',6000);return 'Earthquake.'},
 ()=>{timed(board,'ink',6000);return 'Your answers went invisible.'},
 ()=>{[...pad.children].slice(0,9).forEach(b=>b.style.order=R(99));return 'The keypad got shuffled.'}
];
let evil=false;

function conflicts(){
  const bad=new Set();
  for(const a of cells)if(a.v)for(const b of cells)
    if(b!==a&&b.v===a.v&&(a.r===b.r||a.c===b.c||(B3(a.r)===B3(b.r)&&B3(a.c)===B3(b.c))))bad.add(a);
  return bad;
}
const userFilled=()=>cells.filter(k=>!k.given&&k.v).length;

// Count solutions (stops at 2) so every puzzle has exactly one answer
const PEERS=[...Array(81)].map((_,i)=>{const r=i/9|0,c=i%9,s=new Set();
  for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c);s.add((B3(r)*3+B3(k))*9+B3(c)*3+k%3)}s.delete(i);return[...s]});
function count(a){let best=-1,bm=0,bn=10;
  for(let i=0;i<81;i++)if(!a[i]){let m=0;for(const p of PEERS[i])m|=1<<a[p];m=~m&1022;if(!m)return 0;
    let n=0;for(let x=m;x;x&=x-1)n++;if(n<bn){bn=n;best=i;bm=m}}
  if(best<0)return 1;let n=0;for(let v=1;v<=9;v++)if(bm>>v&1){a[best]=v;n+=count(a);if(n>1)break}a[best]=0;return n}
function dig(target){let removed=0;
  for(const k of [...cells].sort(()=>Math.random()-.5)){if(removed>=target)break;
    const v=k.v;k.v=0;const a=Array(81).fill(0);cells.forEach(x=>a[x.r*9+x.c]=x.v);
    if(count(a)===1){k.given=false;removed++}else k.v=v}}

function render(){
  const bad=conflicts(), sv=sel&&sel.v;
  for(const k of cells){
    k.el.style.transform=`translate(${k.c*100}%,${k.r*100}%)`;
    const t=k.v?G(k.v):'';
    if(k.sp.textContent!==t)k.sp.textContent=t;
    const cl=k.el.classList;
    cl.toggle('long',t.length>2);cl.toggle('given',k.given);cl.toggle('sel',k===sel);cl.toggle('bad',bad.has(k));
    cl.toggle('same',!!sv&&k!==sel&&k.v===sv);
  }
  [...pad.children].forEach((b,i)=>b.textContent=i<9?GLYPHS[g][i]:'⌫');
}

function say(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>msg.style.opacity=0,3500)}
function schedule(){interval=evil?Math.max(2500,7000-userFilled()*80):Math.max(5000,16000-userFilled()*200);nextAt=Date.now()+interval}
function chaos(prefix){
  if(over)return;
  const x=Math.random(), list=evil?(x<.4?STRUCT:x<.6?FX:EVIL):(x<.72?STRUCT:FX), m=list[R(list.length)]();
  events++;say(prefix?prefix+' '+m:m);render();schedule();
}

function select(k){if(!over){sel=k;render()}}
function input(v){
  if(over||!sel||sel.given)return;
  sel.v=v;render();
  if(v&&conflicts().has(sel)&&Date.now()-lastPunish>4000){lastPunish=Date.now();setTimeout(()=>chaos(INSULTS[R(INSULTS.length)]),350)}
  if(cells.every(k=>k.v)&&conflicts().size===0)win();
}
function win(){
  over=true;sel=null;render();bar.style.width='0%';
  const s=Math.floor((Date.now()-start)/1000);
  say(`Solved${evil?' on evil':''} in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}, through ${events} chaos events.`);clearTimeout(msgT);
}

function newGame(){
  board.querySelectorAll('.cell').forEach(e=>e.remove());
  board.style.transform='';board.classList.remove('shy','fog','ink');$('stage').classList.remove('quake');resetPad();
  cells=[];sel=null;events=0;over=false;g=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const el=document.createElement('div'),sp=document.createElement('span');el.className='cell';el.appendChild(sp);
    const k={r,c,v:((r*3+B3(r)+c)%9)+1,given:true,el,sp};
    el.onclick=()=>select(k);board.appendChild(el);cells.push(k);
  }
  board.classList.add('instant');
  for(let i=0;i<40;i++)STRUCT[R(STRUCT.length)]();
  dig(blanks);
  render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>board.classList.remove('instant')));
  start=Date.now();schedule();say('The board rearranges itself. It always stays solvable.');
}

document.addEventListener('keydown',e=>{
  if(/^[1-9]$/.test(e.key))input(+e.key);
  else if(['Backspace','Delete','0'].includes(e.key))input(0);
  else{const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(d){e.preventDefault();const r=Math.min(8,Math.max(0,(sel?sel.r:4)+d[0])),c=Math.min(8,Math.max(0,(sel?sel.c:4)+d[1]));select(cells.find(k=>k.r===r&&k.c===c))}}
});
let blanks=50;
document.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#diff button').forEach(x=>x.classList.toggle('on',x===b));blanks=+b.dataset.n;newGame()});
$('new').onclick=newGame;
$('summon').onclick=()=>chaos('You asked for this.');
$('evil').onclick=()=>{evil=!evil;document.body.classList.toggle('evil',evil);if(!evil)resetPad();
  if(!over){schedule();say(evil?'Evil mode. Good luck.':'Evil mode off. Coward.')}};

(function tick(){
  if(!over){const left=nextAt-Date.now();bar.style.width=Math.max(0,left/interval*100)+'%';if(left<=0)chaos();}
  requestAnimationFrame(tick);
})();
newGame();
</script>
</body></html>
